<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可搬消防ポンプ 効果確認テスト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fire-red: #C41E2A;
    --fire-dark: #8B1A1A;
    --ember: #E8672C;
    --gold: #D4A017;
    --charcoal: #1A1A1A;
    --slate: #2D2D2D;
    --ash: #3A3A3A;
    --smoke: #B0A89A;
    --cream: #F5F0E8;
    --correct: #2E7D32;
    --wrong: #C41E2A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--charcoal);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
    padding: 32px 20px;
    border-bottom: 3px solid var(--fire-red);
  }

  .header::before {
    content: '🔥';
    font-size: 40px;
    display: block;
    margin-bottom: 12px;
  }

  .header h1 {
    font-family: 'Oswald', 'Noto Sans JP', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cream);
    margin-bottom: 8px;
  }

  .header .subtitle {
    font-size: 14px;
    color: var(--smoke);
    letter-spacing: 1px;
  }

  .header .info-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--gold);
    flex-wrap: wrap;
  }

  .info-bar span { display: flex; align-items: center; gap: 6px; }

  /* Entry form */
  .entry-form {
    background: var(--slate);
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 28px;
    border-left: 4px solid var(--gold);
  }

  .entry-form h2 {
    font-size: 16px;
    color: var(--gold);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .form-row {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .form-group {
    flex: 1;
    min-width: 200px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--smoke);
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    padding: 10px 14px;
    background: var(--ash);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: var(--cream);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .form-group input::placeholder {
    color: rgba(176, 168, 154, 0.5);
  }

  .form-error {
    color: var(--wrong);
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  .start-btn, .next-btn, .retry-btn {
    display: block;
    margin: 20px auto 0;
    padding: 12px 40px;
    background: linear-gradient(135deg, var(--fire-red), var(--ember));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .start-btn:hover, .next-btn:hover, .retry-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(196, 30, 42, 0.3);
  }

  .nav-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }

  .back-btn {
    display: block;
    padding: 12px 28px;
    background: var(--ash);
    color: var(--smoke);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s ease;
  }

  .back-btn:hover {
    border-color: var(--smoke);
    color: var(--cream);
    background: rgba(255,255,255,0.06);
  }

  /* Progress */
  .progress-wrap { margin-bottom: 28px; }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--smoke);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 6px;
    background: var(--ash);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--fire-red), var(--ember));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* Question card */
  .question-card {
    background: var(--slate);
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 20px;
    border-left: 4px solid var(--fire-red);
    animation: slideIn 0.35s ease;
  }

  .question-card.calc-card {
    border-left-color: var(--gold);
  }

  .question-card.rescue-card {
    border-left-color: #5C9EFF;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    color: var(--ember);
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .q-type {
    display: inline-block;
    font-size: 11px;
    color: var(--gold);
    background: rgba(212, 160, 23, 0.12);
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 12px;
  }

  .q-type.calc-type {
    color: #FFD54F;
    background: rgba(255, 213, 79, 0.12);
  }

  .q-type.rescue-type {
    color: #90CAF9;
    background: rgba(144, 202, 249, 0.12);
  }

  .q-text {
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 20px;
    font-weight: 700;
  }

  /* Image placeholder */
  .img-placeholder {
    width: 100%;
    min-height: 180px;
    background: var(--ash);
    border: 2px dashed rgba(255,255,255,0.12);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    color: var(--smoke);
    font-size: 14px;
    flex-direction: column;
    gap: 8px;
    padding: 20px;
    text-align: center;
  }

  .img-placeholder img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 6px;
  }

  .img-placeholder .ph-icon { font-size: 32px; opacity: 0.5; }

  .calc-hint {
    background: rgba(212, 160, 23, 0.08);
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--gold);
    border-radius: 0 6px 6px 0;
    line-height: 1.6;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    background: var(--ash);
    border: 2px solid transparent;
    border-radius: 8px;
    color: var(--cream);
    font-size: 15px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    line-height: 1.5;
  }

  .option-btn:hover:not(.disabled) {
    border-color: var(--ember);
    background: rgba(232, 103, 44, 0.08);
  }

  .option-btn .opt-label {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--smoke);
  }

  .option-btn.selected { border-color: var(--ember); background: rgba(232, 103, 44, 0.12); }
  .option-btn.selected .opt-label { background: var(--ember); color: #fff; }
  .option-btn.correct { border-color: var(--correct); background: rgba(46, 125, 50, 0.15); }
  .option-btn.correct .opt-label { background: var(--correct); color: #fff; }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(196, 30, 42, 0.1); opacity: 0.7; }
  .option-btn.disabled { cursor: default; }

  /* Feedback */
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .feedback.correct-fb {
    background: rgba(46, 125, 50, 0.12);
    border-left: 3px solid var(--correct);
    color: #A5D6A7;
  }

  .feedback.wrong-fb {
    background: rgba(196, 30, 42, 0.1);
    border-left: 3px solid var(--wrong);
    color: #EF9A9A;
  }

  /* ===== Result screen: compact 1-viewport layout ===== */
  .result-screen { animation: slideIn 0.5s ease; }

  .result-title {
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    color: var(--smoke);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--ash);
  }

  .result-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 12px;
    padding: 16px 20px;
    background: var(--slate);
    border-radius: 12px;
  }

  .result-score-compact {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .result-score-compact::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 4px solid var(--ash);
  }

  .result-score-compact.pass::before {
    border-color: var(--correct);
    box-shadow: 0 0 20px rgba(46, 125, 50, 0.2);
  }

  .result-score-compact.fail::before {
    border-color: var(--wrong);
    box-shadow: 0 0 20px rgba(196, 30, 42, 0.2);
  }

  .result-score-compact .score-num {
    font-family: 'Oswald', sans-serif;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
  }

  .result-score-compact.pass .score-num { color: #81C784; }
  .result-score-compact.fail .score-num { color: #EF9A9A; }

  .result-score-compact .score-unit {
    font-size: 13px;
    color: var(--smoke);
    margin-top: 2px;
  }

  .result-info { flex: 1; min-width: 0; }

  .result-info .result-verdict {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .result-info .result-verdict.pass { color: #81C784; }
  .result-info .result-verdict.fail { color: #EF9A9A; }

  .result-info .result-stats {
    font-size: 14px;
    color: var(--cream);
    margin-bottom: 2px;
  }

  .result-info .result-passline {
    font-size: 12px;
    color: var(--smoke);
    margin-bottom: 8px;
  }

  .result-info .result-name {
    font-size: 12px;
    color: var(--gold);
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .rescue-notice-compact {
    background: rgba(92, 158, 255, 0.08);
    border-left: 3px solid #5C9EFF;
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 10px;
    font-size: 12px;
    color: #90CAF9;
    line-height: 1.5;
  }

  .result-grid-section {
    background: var(--slate);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .result-grid-section h3 {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }

  .rg-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 2px;
    border-radius: 6px;
    text-align: center;
    gap: 1px;
  }

  .rg-cell .rg-num {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
  }

  .rg-cell .rg-icon { font-size: 15px; }

  .rg-cell.rg-correct { background: rgba(46, 125, 50, 0.15); color: #81C784; }
  .rg-cell.rg-wrong { background: rgba(196, 30, 42, 0.12); color: #EF9A9A; }
  .rg-cell.rg-unanswered { background: rgba(255,255,255,0.04); color: var(--smoke); }
  .rg-cell.rg-rescued { background: rgba(92, 158, 255, 0.12); color: #90CAF9; }

  .result-category-summary {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 12px;
    color: var(--smoke);
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .result-category-summary span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .cat-label { color: var(--smoke); }
  .cat-score { font-weight: 700; }
  .cat-score.good { color: #81C784; }
  .cat-score.bad { color: #EF9A9A; }

  .result-legend {
    display: flex;
    justify-content: center;
    gap: 12px;
    font-size: 10px;
    color: var(--smoke);
    margin-top: 8px;
  }

  .result-legend span {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .result-message {
    text-align: center;
    font-size: 13px;
    color: var(--smoke);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .hidden { display: none; }

  /* Question map */
  .question-map {
    margin-bottom: 24px;
    background: var(--slate);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .question-map h3 {
    font-size: 12px;
    color: var(--smoke);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .qmap-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .qmap-cell {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 2px solid transparent;
  }

  .qmap-cell.unanswered {
    background: var(--ash);
    color: var(--smoke);
  }

  .qmap-cell.answered {
    background: rgba(46, 125, 50, 0.2);
    color: #81C784;
    border-color: rgba(46, 125, 50, 0.3);
  }

  .qmap-cell.current {
    border-color: var(--ember);
    box-shadow: 0 0 8px rgba(232, 103, 44, 0.3);
  }

  .qmap-cell:hover {
    transform: scale(1.1);
    border-color: var(--gold);
  }

  .qmap-legend {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    font-size: 11px;
    color: var(--smoke);
  }

  .qmap-legend span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .qmap-legend .dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
  }

  .dot.dot-current { background: var(--ember); }
  .dot.dot-answered { background: rgba(46, 125, 50, 0.5); }
  .dot.dot-unanswered { background: var(--ash); }

  .skip-btn {
    display: block;
    padding: 10px 24px;
    background: transparent;
    color: var(--smoke);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .skip-btn:hover {
    border-color: var(--smoke);
    color: var(--cream);
  }

  .submit-btn {
    display: block;
    margin: 24px auto 0;
    padding: 14px 48px;
    background: linear-gradient(135deg, var(--fire-red), var(--ember));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(196, 30, 42, 0.3);
  }

  /* Confirmation modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }

  .modal-box {
    background: var(--slate);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 440px;
    width: 90%;
    border: 2px solid var(--ember);
    text-align: center;
  }

  .modal-box h3 {
    font-size: 18px;
    color: var(--ember);
    margin-bottom: 12px;
  }

  .modal-box p {
    font-size: 14px;
    color: var(--smoke);
    line-height: 1.7;
    margin-bottom: 8px;
  }

  .modal-box .unanswered-list {
    background: var(--ash);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 12px 0 20px;
    font-size: 13px;
    color: var(--gold);
    text-align: left;
    line-height: 1.8;
  }

  .modal-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .modal-btn-back {
    padding: 10px 24px;
    background: var(--ash);
    color: var(--cream);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .modal-btn-back:hover {
    border-color: var(--smoke);
  }

  .modal-btn-submit {
    padding: 10px 24px;
    background: linear-gradient(135deg, var(--fire-red), var(--ember));
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .modal-btn-submit:hover {
    transform: translateY(-1px);
  }

  /* ===== Responsive: Tablet (768px以下) ===== */
  @media (max-width: 768px) {
    .container {
      max-width: 100%;
      padding: 20px 16px 48px;
    }

    .header {
      padding: 24px 16px;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 24px;
      letter-spacing: 2px;
    }

    .header .info-bar {
      gap: 16px;
      font-size: 12px;
    }

    .entry-form {
      padding: 24px 20px;
    }

    .question-card {
      padding: 24px 20px;
    }

    .modal-box {
      max-width: 400px;
      padding: 24px 20px;
    }
  }

  /* ===== Responsive: Mobile (480px以下) ===== */
  @media (max-width: 480px) {
    .container {
      padding: 12px 12px 40px;
    }

    .header {
      padding: 20px 12px;
      margin-bottom: 20px;
    }

    .header::before {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 20px;
      letter-spacing: 1px;
    }

    .header .subtitle {
      font-size: 12px;
    }

    .header .info-bar {
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
    }

    .entry-form {
      padding: 20px 16px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .entry-form h2 {
      font-size: 15px;
      margin-bottom: 16px;
    }

    .form-row {
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      min-width: 0;
    }

    .form-group input {
      padding: 12px 14px;
      font-size: 16px; /* iOS zoom防止 */
    }

    .start-btn, .next-btn, .retry-btn {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
    }

    .progress-info {
      font-size: 12px;
    }

    .question-map {
      padding: 12px 14px;
    }

    .question-map h3 {
      font-size: 11px;
    }

    .qmap-cell {
      width: 32px;
      height: 32px;
      font-size: 12px;
    }

    .qmap-legend {

let currentQ = 0;
let answers = []; // { qIndex, selected, correct, qId, category }
let userName = '';
let userRank = '';
let unitName = '目黒消防団 第８分団';
let shuffleMap = []; // shuffleMap[qIndex] = [originalIdx...] in display order

// ===== HELPERS =====
function getAnswer(qIdx) {
  return answers.find(a => a.qIndex === qIdx) || null;
}

function answeredCount() {
  return answers.length;
}

function unansweredIndices() {
  const answered = new Set(answers.map(a => a.qIndex));
  return questions.map((_, i) => i).filter(i => !answered.has(i));
}

// ===== FUNCTIONS =====
function initShuffleMap() {
  shuffleMap = questions.map(q => {
    const indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  });
}

function startQuiz() {
  const uName = document.getElementById('user-name').value.trim();
  const uRank = document.getElementById('user-rank').value.trim();
  const uUnit = document.getElementById('unit-name').value.trim();

  if (!uName || !uRank || !uUnit) {
    document.getElementById('form-error').style.display = 'block';
    return;
  }

  userName = uName;
  userRank = uRank;
  unitName = uUnit;
  document.getElementById('entry-area').classList.add('hidden');
  document.getElementById('quiz-area').classList.remove('hidden');
  initShuffleMap();
  renderQuestionMap();
  renderQuestion();
}

function renderQuestionMap() {
  const total = questions.length;
  let cells = '';
  for (let i = 0; i < total; i++) {
    const isAnswered = !!getAnswer(i);
    const isCurrent = i === currentQ;
    let cls = 'qmap-cell';
    cls += isAnswered ? ' answered' : ' unanswered';
    if (isCurrent) cls += ' current';
    cells += `<div class="${cls}" onclick="jumpTo(${i})" title="Q${i+1}">${i+1}</div>`;
  }

  const html = `<div class="question-map">
    <h3>回答状況（クリックで移動）</h3>
    <div class="qmap-grid">${cells}</div>
    <div class="qmap-legend">
      <span><span class="dot dot-current"></span> 現在</span>
      <span><span class="dot dot-answered"></span> 回答済</span>
      <span><span class="dot dot-unanswered"></span> 未回答</span>
    </div>
  </div>`;

  document.getElementById('question-map-container').innerHTML = html;

  // Update progress bar based on answered count
  const pct = Math.round((answeredCount() / total) * 100);
  document.getElementById('progress-text').textContent = `${answeredCount()}問回答済 / ${total}問（現在：第${currentQ + 1}問）`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = `${pct}%`;
}

function renderQuestion() {
  const q = questions[currentQ];
  const labels = ['A', 'B', 'C', 'D'];
  const total = questions.length;

  const isCalc = q.category === 'calc';
  const isRescue = q.category === 'rescue';
  const cardClass = isCalc ? 'calc-card' : isRescue ? 'rescue-card' : '';
  const typeClass = isCalc ? 'calc-type' : isRescue ? 'rescue-type' : '';

  const prevAnswer = getAnswer(currentQ);
  const isAnswered = !!prevAnswer;

  let html = `<div class="question-card ${cardClass}">
    <div class="q-number">Question ${String(currentQ + 1).padStart(2, '0')}</div>
    <div class="q-type ${typeClass}">${q.type}</div>`;

  if (isCalc) {
    html += `<div class="img-placeholder">
      <img src="${q.image}" alt="配置図">
    </div>`;
    html += `<div class="calc-hint">
      <strong>公式：</strong>送水圧力 ＝ 筒先圧力 ＋ 摩擦損失 ＋ 高低差による損失<br>
      <strong>${q.condition}</strong><br>
      <span style="font-size:12px; opacity:0.8;">ただし、摩擦損失はホース1本あたり0.03MPaとし、流量2倍の場合は4倍となる。分岐金具は0.1MPaの損失とする。ホース耐圧は1.3MPaとする。</span>
    </div>`;
  }

  html += `<div class="q-text">${q.text}</div>
    <div class="options" id="options">`;

  const map = shuffleMap[currentQ];
  map.forEach((origIdx, displayIdx) => {
    let btnClass = 'option-btn';
    if (isAnswered && prevAnswer.selected === origIdx) {
      btnClass += ' selected';
    }
    html += `<button class="${btnClass}" data-index="${displayIdx}" onclick="selectAnswer(${displayIdx})">
      <span class="opt-label">${labels[displayIdx]}</span>
      <span>${q.options[origIdx]}</span>
    </button>`;
  });

  html += `</div></div>`;

  // Navigation buttons
  html += `<div class="nav-buttons">`;
  if (currentQ === 0) {
    html += `<button class="back-btn" onclick="backToEntry()">← 受験者情報</button>`;
  } else {
    html += `<button class="back-btn" onclick="prevQuestion()">← 前の問題</button>`;
  }
  if (currentQ < total - 1) {
    html += `<button class="next-btn" style="margin:0;" onclick="nextQuestion()">次の問題へ →</button>`;
  }
  html += `</div>`;

  document.getElementById('question-container').innerHTML = html;
  renderQuestionMap();
}

function selectAnswer(displayIdx) {
  const q = questions[currentQ];
  const origIdx = shuffleMap[currentQ][displayIdx];

  // Remove previous answer for this question if exists
  answers = answers.filter(a => a.qIndex !== currentQ);

  // Store original index so answer checking works regardless of shuffle
  answers.push({
    qIndex: currentQ,
    selected: origIdx,
    qId: q.id,
    category: q.category
  });

  renderQuestion();
}

function nextQuestion() {
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function jumpTo(idx) {
  if (idx >= 0 && idx < questions.length) {
    currentQ = idx;
    renderQuestion();
  }
}

function backToEntry() {
  document.getElementById('quiz-area').classList.add('hidden');
  document.getElementById('entry-area').classList.remove('hidden');
}

function trySubmit() {
  const missing = unansweredIndices();

  if (missing.length === 0) {
    showResult();
    return;
  }

  // Show confirmation modal
  const missingList = missing.map(i => `Q${i + 1}`).join('、');
  const modalHtml = `<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h3>⚠️ 未回答の問題があります</h3>
      <p>以下の問題がまだ回答されていません：</p>
      <div class="unanswered-list">${missingList}（${missing.length}問）</div>
      <p>未回答の問題は不正解として採点されます。<br>このまま提出してよろしいですか？</p>
      <div class="modal-buttons">
        <button class="modal-btn-back" onclick="closeModalAndGoTo(${missing[0]})">戻って回答する</button>
        <button class="modal-btn-submit" onclick="confirmSubmit()">このまま提出</button>
      </div>
    </div>
  </div>`;

  document.getElementById('modal-container').innerHTML = modalHtml;
}

function closeModalAndGoTo(idx) {
  document.getElementById('modal-container').innerHTML = '';
  jumpTo(idx);
}

function confirmSubmit() {
  document.getElementById('modal-container').innerHTML = '';
  showResult();
}

function applyRescueLogic() {
  const calcAnswers = answers.filter(a => a.category === 'calc');
  const anyCalcCorrect = calcAnswers.some(a => a.correct);

  if (anyCalcCorrect) return false;

  const rescueAnswer = answers.find(a => a.category === 'rescue');
  if (rescueAnswer && rescueAnswer.correct) {
    answers.forEach(a => {
      if (a.qId === 'calc-1' || a.qId === 'calc-2') {
        a.correct = true;
        a.rescued = true;
      }
    });
    return true;
  }

  return false;
}

function showResult() {
  document.getElementById('quiz-area').classList.add('hidden');
  const resultArea = document.getElementById('result-area');
  resultArea.classList.remove('hidden');

  // Judge all answers now
  answers.forEach(a => {
    const q = questions[a.qIndex];
    a.correct = a.selected === q.answer;
  });

  const rescued = applyRescueLogic();

  const totalCorrect = answers.filter(a => a.correct).length;
  const total = questions.length;
  const pct = Math.round((totalCorrect / total) * 100);
  const passed = pct >= 70;

  // Category scores
  const categories = {
    basic: { correct: 0, total: 0, label: '基礎' },
    calc: { correct: 0, total: 0, label: '計算' },
    rescue: { correct: 0, total: 0, label: '文言' }
  };
  for (let i = 0; i < total; i++) {
    const q = questions[i];
    const cat = categories[q.category];
    cat.total++;
    const a = getAnswer(i);
    if (a && a.correct) cat.correct++;
  }

  // Build compact result grid
  let gridHtml = '';
  for (let i = 0; i < total; i++) {
    const a = getAnswer(i);
    let cellClass, icon;
    if (!a) {
      cellClass = 'rg-unanswered';
      icon = '—';
    } else if (a.rescued) {
      cellClass = 'rg-rescued';
      icon = '🔄';
    } else if (a.correct) {
      cellClass = 'rg-correct';
      icon = '⭕';
    } else {
      cellClass = 'rg-wrong';
      icon = '❌';
    }
    gridHtml += `<div class="rg-cell ${cellClass}"><span class="rg-num">Q${i+1}</span><span class="rg-icon">${icon}</span></div>`;
  }

  // Category summary
  let catHtml = '';
  for (const key of ['basic', 'calc', 'rescue']) {
    const cat = categories[key];
    const isGood = cat.total > 0 && (cat.correct / cat.total) >= 0.7;
    catHtml += `<span><span class="cat-label">${cat.label}:</span> <span class="cat-score ${isGood ? 'good' : 'bad'}">${cat.correct}/${cat.total}</span></span>`;
  }

  // Rescue notice
  let rescueHtml = '';
  if (rescued) {
    rescueHtml = `<div class="rescue-notice-compact">
      <strong>📘 救済適用：</strong>計算問題全問不正解 → 文言選択正解により計算Q1・Q2を正解扱い
    </div>`;
  }

  // Result message
  const message = passed
    ? 'よく理解できています。引き続き整備と訓練を怠らず活動しましょう。'
    : '70点未満のため、講習資料を見直した上で再テストを受けてください。';

  resultArea.innerHTML = `<div class="result-screen">
    <div class="result-title">可搬消防ポンプ 効果確認テスト ─ 結果</div>

    <div class="result-header">
      <div class="result-score-compact ${passed ? 'pass' : 'fail'}">
        <span class="score-num">${pct}</span>
        <span class="score-unit">点</span>
      </div>
      <div class="result-info">
        <div class="result-verdict ${passed ? 'pass' : 'fail'}">${passed ? '🎉 合格' : '⚠️ 不合格'}</div>
        <div class="result-stats">${total}問中 ${totalCorrect}問正解（${pct}点）</div>
        <div class="result-passline">合格ライン：70点以上（${Math.ceil(total * 0.7)}問正解）</div>
        <div class="result-name">${unitName}　${userRank}　${userName}</div>
      </div>
    </div>

    ${rescueHtml}

    <div class="result-grid-section">
      <h3>📋 回答結果</h3>
      <div class="result-grid">${gridHtml}</div>
      <div class="result-category-summary">${catHtml}</div>
      <div class="result-legend">
        <span>⭕ 正解</span>
        <span>❌ 不正解</span>
        <span>— 未回答</span>
        <span>🔄 救済</span>
      </div>
    </div>

    <div class="result-message">${message}</div>

    <button class="retry-btn" onclick="retryQuiz()">${passed ? 'もう一度挑戦する' : '🔄 再テストを受ける'}</button>
  </div>`;
}

function retryQuiz() {
  currentQ = 0;
  answers = [];
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('result-area').innerHTML = '';
  document.getElementById('quiz-area').classList.remove('hidden');
  initShuffleMap();
  renderQuestionMap();
  renderQuestion();
}

// Allow Enter key on form
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('entry-area').classList.contains('hidden')) {
    startQuiz();
  }
});
</script>

</body>
</html>
